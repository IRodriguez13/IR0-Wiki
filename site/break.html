<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/theme-init.js?v=7"></script>
    <title>Explore IR0 — Break IR0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/journal.css?v=7">
</head>
<body>
    <header class="masthead">
        <div class="masthead-inner">
            <div>
                <div class="journal-title">Explore IR0</div>
                <div class="journal-sub">Failure laboratory</div>
            </div>
            <ul class="nav-links"></ul>
        </div>
    </header>
    <div class="edition-bar" id="edition-bar"><span id="edition-text">Loading…</span></div>

    <main class="page">
        <h1 id="break-heading">Break IR0</h1>
        <p id="break-sub" class="section-note"></p>

        <h2 class="section-head" id="break-pick-label">Pick a failure</h2>
        <div class="break-themes" id="break-themes"></div>

        <div class="break-stage">
            <div class="cmd" id="break-cmd"></div>
            <div id="break-hook" class="break-hook" hidden></div>
            <div id="break-play">
                <h2 class="section-head" id="break-seq-label">What the machine does</h2>
                <div class="break-sequence" id="break-sequence"></div>
                <div class="player-controls">
                    <button type="button" id="break-prev" class="secondary">◀ prev</button>
                    <button type="button" id="break-next">next ▶</button>
                    <span id="break-counter">1 / 1</span>
                </div>
                <div class="break-step-detail" id="break-detail"></div>
                <p><a id="break-story" href="#" hidden>Replay a real trace →</a></p>
            </div>
        </div>
    </main>
    <footer class="footer-note"><a href="index.html">← Explore</a></footer>
    <script src="js/edition.js?v=7"></script>
    <script src="js/explore-common.js?v=7"></script>
    <script src="js/break-lab.js?v=7"></script>
</body>
</html>
