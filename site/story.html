<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/theme-init.js?v=8"></script>
    <title>Explore IR0 — QEMU trace replay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/journal.css?v=9">
</head>
<body id="story-player">
    <header class="masthead">
        <div class="masthead-inner">
            <div>
                <div class="journal-title">Explore IR0</div>
                <div class="journal-sub">QEMU trace replay</div>
            </div>
            <ul class="nav-links"></ul>
        </div>
    </header>
    <div class="edition-bar" id="edition-bar">
        <span id="edition-text">Loading edition…</span>
    </div>

    <main class="page">
        <header class="story-header">
            <h1 id="story-title">Loading…</h1>
            <p id="story-subtitle"></p>
            <div class="cmd" id="story-cmd"></div>
            <p class="section-note" id="story-trace-edition" hidden></p>
            <p id="story-journey-wrap" hidden>
                <a id="story-journey-link" href="#"></a>
            </p>
            <p style="font-size:0.85rem;color:var(--ink-muted)">
                <span id="story-other-label">Other stories:</span>
                <a href="story.html?id=null-dereference">NULL</a> ·
                <a href="story.html?id=ls-root">ls /</a> ·
                <a href="story.html?id=hello-tcc">hello + TCC</a>
            </p>
        </header>

        <div class="timeline" id="story-timeline"></div>

        <div class="player-controls">
            <button type="button" id="btn-prev" class="secondary">◀ prev</button>
            <button type="button" id="btn-play">▶ play</button>
            <button type="button" id="btn-next" class="secondary">next ▶</button>
            <input type="range" id="step-slider" min="0" max="7" value="0" aria-label="Step">
            <span id="step-counter">1 / 8</span>
        </div>

        <div class="panel-grid">
            <div class="panel" id="panel-code">
                <div class="panel-head">Code</div>
                <div class="panel-body"></div>
            </div>
            <div class="panel" id="panel-cpu">
                <div class="panel-head">CPU &amp; memory</div>
                <div class="panel-body"></div>
            </div>
            <div class="panel" id="panel-kernel">
                <div class="panel-head">Kernel</div>
                <div class="panel-body"></div>
            </div>
            <div class="panel" id="panel-terminal">
                <div class="panel-head">Terminal</div>
                <div class="panel-body"></div>
            </div>
        </div>

        <div class="step-detail" id="step-detail"></div>
        <p class="trace-evidence">Evidence: <span id="trace-line">—</span></p>

        <h3 class="section-head" style="font-size:0.85rem;margin-top:1.5rem" id="story-path-head">Path through kernel map</h3>
        <div class="atlas-mini-wrap" id="atlas-mini"></div>

        <div class="compare-box" id="compare-box"></div>
    </main>

    <footer class="footer-note"><a href="index.html">← Explore</a></footer>
    <script src="js/edition.js?v=9"></script>
    <script src="js/explore-common.js?v=9"></script>
    <script src="js/story-playback.js?v=9"></script>
    <script src="js/atlas-map.js?v=9"></script>
    <script src="js/story-player.js?v=9"></script>
</body>
</html>
